name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ========== 1. 编译 New API ARM64 二进制 ==========
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache-dependency-path: |
            newapi-src/go.sum
            newapi-src/relaykit/go.sum

      - name: Extract New API source
        run: |
          # 从 tar.gz 解压源码
          mkdir -p newapi-src
          tar xzf newapi-src.tar.gz -C newapi-src
          ls newapi-src | head -10

      - name: Build New API ARM64 binary
        working-directory: newapi-src
        run: |
          # 前端剥离：放置占位 index.html（源码零改动）
          mkdir -p web/dist
          cat > web/dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head><meta charset="utf-8"><title>New API (Headless)</title></head>
          <body><h3>New API backend running in headless mode.</h3></body>
          </html>
          EOF
          # 静态编译 arm64
          export CGO_ENABLED=0 GOOS=linux GOARCH=arm64
          go build -trimpath -ldflags '-s -w' -o libnewapi.so .

      # ========== 2. 放置二进制到 jniLibs ==========
      - name: Place binary into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp newapi-src/libnewapi.so android/app/src/main/jniLibs/arm64-v8a/libnewapi.so
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      # ========== 3. 构建 APK ==========
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      # ========== 4. 发布到 Release ==========
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: newapi-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.2-m5
          name: v0.5.2-m5 (启停修复 + 自动获取模型)
          body: |
            ## v0.5.2-m5 (启停修复 + 自动获取模型)

            ### 本次修复
            - 修复：令牌/渠道启停报 `Unexpected JSON token ... Expected start of object '{', but had 't'`
            - 根因：启停接口返回 `{"data":true}`（布尔），原用 EmptyData 解析失败
            - 修复：新增 BooleanData 模型解析 data:true/false
            - 新增：新建渠道时「自动获取上游模型」按钮（调 POST /api/channel/fetch_models，自动填入 models 字段）

            ### 下载（两种方式任选）

            **方式一：GitHub 直连**
            https://github.com/Black0Bag/newapi-android/releases/download/v0.5.2-m5/app-debug.apk

            **方式二：镜像加速（国内推荐）**
            https://gh-proxy.cn/https://github.com/Black0Bag/newapi-android/releases/download/v0.5.2-m5/app-debug.apk
          files: |
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false