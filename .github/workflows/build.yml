name: Build APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # ========== 1. 编译 New API ARM64 二进制 ==========
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache-dependency-path: |
            newapi-src/go.sum
            newapi-src/relaykit/go.sum

      - name: Extract New API source
        run: |
          # 从 tar.gz 解压源码
          mkdir -p newapi-src
          tar xzf newapi-src.tar.gz -C newapi-src
          ls newapi-src | head -10

      - name: Build New API ARM64 binary
        working-directory: newapi-src
        run: |
          # 前端剥离：放置占位 index.html（源码零改动）
          mkdir -p web/dist
          cat > web/dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head><meta charset="utf-8"><title>New API (Headless)</title></head>
          <body><h3>New API backend running in headless mode.</h3></body>
          </html>
          EOF
          # 静态编译 arm64
          export CGO_ENABLED=0 GOOS=linux GOARCH=arm64
          go build -trimpath -ldflags '-s -w' -o libnewapi.so .

      # ========== 2. 放置二进制到 jniLibs ==========
      - name: Place binary into jniLibs
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp newapi-src/libnewapi.so android/app/src/main/jniLibs/arm64-v8a/libnewapi.so
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      # ========== 3. 构建 APK ==========
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      # ========== 4. 发布到 Release ==========
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: newapi-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0-m5
          name: v0.5.0-m5 (6屏接真实API)
          body: |
            ## v0.5.0-m5 (6 屏接真实 API)

            M5-③ 功能填充完成！6 个屏幕全部接入 New API 后端，全部数据均经本地实测确认格式。

            ### 本次新增
            - **仪表盘**：用户信息 + 本周期配额/RPM/TPM（无余额，符合自用场景）
            - **令牌管理**：列表 / 创建 / 揭示完整 sk- key（仅一次可见） / 启停 / 删除
            - **渠道管理**：列表 / 新建（12 种类型下拉选） / 测试 / 启停 / 删除
            - **请求日志**：最近 20 条 + 类型标签 + request_id 可复制
            - **模型市场**：渠道可用模型列表 + 一键复制
            - **设置**：主题切换（跟随/浅/深）/ 端口显示 / 配置备份导出导入（本地，不上云）/ 退出登录

            ### 本次修复
            - Models.kt 全部字段以本地后端实测 JSON 为准（不再"猜字段"）
            - ApiClient 新增 putWithQuery（令牌启停要 ?status_only=true）
            - 令牌/渠道的「删除/启停」均二次确认（用户硬性要求）
            - 所有可复制文本（日志 request_id、用户名、模型名、导出路径、错误消息）都加复制按钮
            - versionName = 0.5.0

            ### 下载（两种方式任选）

            **方式一：GitHub 直连**
            https://github.com/Black0Bag/newapi-android/releases/download/v0.5.0-m5/app-debug.apk

            **方式二：镜像加速（国内推荐）**
            https://gh-proxy.cn/https://github.com/Black0Bag/newapi-android/releases/download/v0.5.0-m5/app-debug.apk
          files: |
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: false